# Fly.io (https://fly.io/docs/reference/configuration/). `app`/`primary_region` are placeholders.
# Database: Fly Managed Postgres or any external managed Postgres with PostGIS (DATABASE_URL secret).
# Redis: Upstash for Redis via `fly redis create` (REDIS_URL secret). Secrets: `fly secrets set`.
app = "rpl-example"
primary_region = "bom"

[build]
  dockerfile = "docker/Dockerfile"
  build-target = "runtime"

[deploy]
  release_command = "bin/release"
  strategy = "rolling"

[env]
  DJANGO_SETTINGS_MODULE = "config.settings.production"
  APP_ENV = "prod"
  PORT = "8000"
  CLIENT_IP_HEADER = "Fly-Client-IP"
  FORWARDED_ALLOW_IPS = "*"

[processes]
  web = "bin/web"
  worker = "bin/worker"
  beat = "bin/beat"            # keep at exactly 1 machine: `fly scale count beat=1`

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"
  min_machines_running = 2
  processes = ["web"]

  [[http_service.checks]]
    grace_period = "20s"
    interval = "15s"
    timeout = "5s"
    method = "GET"
    path = "/healthz"

[[vm]]
  processes = ["web", "worker"]
  size = "shared-cpu-2x"
  memory = "1gb"

[[vm]]
  processes = ["beat"]
  size = "shared-cpu-1x"
  memory = "512mb"
